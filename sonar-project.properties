# SonarQube scanner configuration for SonarLens.
# Credentials (SONAR_HOST_URL, SONAR_TOKEN) are passed as environment
# variables by run-scan.sh; nothing sensitive lives in this file.

sonar.projectKey=Sonarlens
sonar.projectName=SonarLens
sonar.projectVersion=1.0

# All Python sources live under app/.
sonar.sources=app
sonar.language=python

# Python 3 source level for the analyzer.
sonar.python.version=3

# Skip vendored or non-source directories. Nothing matches today, but
# the exclusions keep scans stable if local artifacts appear.
sonar.exclusions=**/__pycache__/**,**/*.pyc
